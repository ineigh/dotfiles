[general]
import = [
	"~/.config/alacritty/alabaster_dark.toml"
]

# [env]
# WINIT_X11_SCALE_FACTOR = "1.0"

[window]
dimensions = { columns = 115, lines = 35 }
opacity = 0.7
# opacity = 1.0
resize_increments = true
# dynamic_title = false

[scrolling]
history = 100000
multiplier = 1

[font]
normal = { family = "Iosevka", style = "Bold" }
bold = { family = "Iosevka", style = "Bold" }
italic = { family = "Iosevka", style = "Bold" }
bold_italic = { family = "Iosevka", style = "Bold" }
size = 20

[bell]
animation = "Linear"
duration = 100 
color = "#000000"

[cursor]
style = { shape = "Beam", blinking = "Always" }
vi_mode_style = { shape = "Block", blinking = "Always" }
blink_interval = 450

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true
