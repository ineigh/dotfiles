# misc
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g status-style bg=blue,fg=white
set -g status-left ""
set -g status-right "[#S]"
set -g window-status-current-style bg=white,fg=blue
set -g set-clipboard on
set -g default-command "bash"

# source config
unbind r
bind r source-file $HOME/.tmux.conf

# make prefix key ctrl+a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# unbind % and ", use v and s instead
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# make new windows with n and kill them with p
unbind n
bind n new-window
unbind p
bind p kill-window

# kill panes with c
unbind c
bind c kill-pane

# move with alt+hjkl a la vim
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# shift+arrows to switch window
bind -n S-Left previous-window
bind -n S-Right next-window

# alt+num to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# vim style copying
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane
