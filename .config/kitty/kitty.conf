font_size 20.0
cursor_shape beam
background_opacity 0.70
wayland_titlebar_color #000000
remember_window_size  no
initial_window_width  1195
initial_window_height 790
confirm_os_window_close 0
open_url_with default
detect_urls yes
#copy_on_select clipboard
wheel_scroll_min_lines 1
touch_scroll_multiplier 1.0
resize_in_steps yes
map ctrl+backspace send_text all \x1b\x7f
map ctrl+v paste_from_clipboard
map ctrl+0 reset_font_size
map ctrl+= increase_font_size
map ctrl+- decrease_font_size
map ctrl+shift+q quit
window_resize_step 4
allow_remote_control yes

color0  #2E3436
color8  #555753
